<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Stocks</title>
<link rel="apple-touch-icon" href="icon.png?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230e1116'/%3E%3Cpolyline points='15,70 38,48 55,58 85,28' stroke='%234ade80' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e1116; --card:#171c24; --card2:#1e2530; --line:#2a3342;
  --text:#e8ecf2; --dim:#93a1b5; --faint:#5c6a80;
  --up:#4ade80; --down:#f87171; --accent:#7dd3fc;
  --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.45;padding-top:var(--sat);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{padding:18px 0 8px;display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:1.35rem;font-weight:700}
.updated{color:var(--faint);font-size:.72rem;margin-top:2px}
.vtoggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:4px}
.vtoggle button{background:var(--card);color:var(--dim);border:none;padding:6px 10px;font-size:.72rem;font-weight:600;cursor:pointer}
.vtoggle button.on{background:var(--accent);color:#08222e}
.totalcard{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.total-label{color:var(--dim);font-size:.8rem}
.total-val{font-size:2.1rem;font-weight:800;letter-spacing:-.5px;margin:2px 0}
.total-sub{font-size:.95rem;margin-top:2px;font-weight:600}
.chgbar{display:flex;gap:6px;margin-top:10px}
.chgbar button{background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 10px;font-size:.72rem;font-weight:600;cursor:pointer}
.chgbar button.on{color:var(--text);border-color:var(--accent)}
.total-note{color:var(--faint);font-size:.72rem;margin-top:8px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--dim)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;position:sticky;top:var(--sat);background:var(--bg);z-index:5;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:600;cursor:pointer}
.tab.active{background:var(--accent);color:#08222e;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.rowcard{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.rowcard .l .sym{font-weight:700}
.rowcard .l .nm{color:var(--dim);font-size:.75rem;max-width:200px}
.rowcard .r{text-align:right}
.rowcard .r .v{font-weight:700}
.rowcard .r .d{font-size:.8rem}
.desc{color:var(--dim);font-size:.9rem}
.price-big{font-size:1.8rem;font-weight:800;margin-top:6px}
.price-small{color:var(--faint);font-size:.85rem;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;flex:1 1 28%}
.chip .p{font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.chip .v{font-weight:700;font-size:.95rem;margin-top:2px}
.chip .m{font-size:.65rem;color:var(--faint);margin-top:2px}
.sect{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--faint);margin:18px 0 6px}
.pos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pos-grid .cell{background:var(--card2);border-radius:10px;padding:10px}
.cell .k{color:var(--faint);font-size:.7rem}
.cell .v{font-weight:700;margin-top:2px}
.plain{background:var(--card2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 12px;font-size:.9rem;margin:12px 0}
.periods{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
.pbtn{background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:5px 10px;font-size:.75rem;font-weight:600;cursor:pointer}
.pbtn.active{color:var(--text);border-color:var(--accent)}
.chwrap{position:relative}
svg.chart{width:100%;height:180px;display:block;touch-action:pan-y}
.tip{position:absolute;background:#0b0e13;border:1px solid var(--accent);border-radius:8px;padding:4px 8px;font-size:.72rem;pointer-events:none;display:none;white-space:nowrap;z-index:6;transform:translate(-50%,-130%)}
.tip b{color:var(--accent)}
.chfoot{display:flex;justify-content:space-between;color:var(--faint);font-size:.7rem;margin-top:4px}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--dim);margin-top:6px}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.alloc-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.alloc-row .sym{width:56px;font-weight:700;font-size:.85rem}
.alloc-row .bar{flex:1;height:14px;background:var(--card2);border-radius:7px;overflow:hidden}
.alloc-row .fill{height:100%;border-radius:7px}
.alloc-row .pct{width:88px;text-align:right;font-size:.75rem;color:var(--dim)}
.mover{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.mover:last-child{border-bottom:none}
.news a{color:var(--text);text-decoration:none;font-size:.9rem;display:block}
.news .item{padding:10px 0;border-bottom:1px solid var(--line)}
.news .item:last-child{border-bottom:none}
.news .dt{color:var(--faint);font-size:.7rem;margin-top:2px}
.note{color:var(--faint);font-size:.75rem;margin-top:10px}
.badge{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.72rem;color:var(--dim);margin-top:8px}
.setup input{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;margin-top:8px;font-size:.85rem}
.setup button{background:var(--accent);color:#08222e;border:none;border-radius:8px;padding:10px 14px;font-weight:700;margin-top:8px;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>My Stocks</h1>
      <div class="updated" id="updated"></div>
    </div>
    <div class="vtoggle" id="vtoggle">
      <button data-v="value">$ value</button>
      <button data-v="share">per share</button>
    </div>
  </header>
  <div id="totals"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="content"></main>
</div>

<script>
function loadHoldings(){
  const h = location.hash;
  if (h.startsWith('#h=')){
    try{
      const dec = JSON.parse(atob(decodeURIComponent(h.slice(3))));
      localStorage.setItem('holdings', JSON.stringify(dec));
      return dec;
    }catch(e){}
  }
  try{ return JSON.parse(localStorage.getItem('holdings')); }catch(e){ return null; }
}
function saveFromPaste(){
  const v = document.getElementById('pasteLink').value;
  const i = v.indexOf('#h=');
  if (i < 0){ alert('That doesn’t look like the private link — it should contain #h='); return; }
  location.hash = v.slice(i);
  location.reload();
}

const DESC = {
  ARTY:"A fund holding dozens of companies working on artificial intelligence and robotics. Owning ARTY means owning a small slice of each of them.",
  AAPL:"Apple — the iPhone company. This is the only individual company you own directly; everything else in your account is a fund (a basket of many companies), so Apple will swing harder in both directions.",
  VUG:"A fund of a few hundred large U.S. “growth” companies — businesses expected to grow faster than average, like Apple, Microsoft and Nvidia.",
  QQQ:"A fund tracking the 100 largest companies on the Nasdaq exchange. Heavily tilted toward technology.",
  SDY:"A fund of companies with a long track record of paying dividends (regular cash payouts to shareholders). Typically steadier and less dramatic than tech.",
  SWPPX:"A fund tracking the S&P 500 — the 500 biggest U.S. companies. Owning it is like owning a sliver of the whole U.S. stock market. As a mutual fund its price updates once a day, after the market closes.",
};
const COLORS={ARTY:"#7dd3fc",AAPL:"#4ade80",VUG:"#fbbf24",QQQ:"#f472b6",SDY:"#a78bfa",SWPPX:"#fb923c",Cash:"#5c6a80"};

const PERIODS = [["1W",5],["1M",21],["3M",63],["YTD","ytd"],["1Y",252],["5Y",99999]];
const CHG_PERIODS = [["Day","day"],["Week",5],["Month",21],["Year",252]];

let DATA=null, HOLD=null, active="overview", chartPeriod={}, cmpMarket={}, acctSpan=252;
let viewMode = localStorage.getItem('viewMode') || 'value';
let chgMode = localStorage.getItem('chgMode') || 'day';
let CHARTS={}, chartSeq=0;

const $=s=>document.querySelector(s);
const fmt$=n=>n==null?"—":n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits: Math.abs(n)>=1000?0:2});
const fmtCents=n=>n==null?"—":Math.abs(n).toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2});
const fmtChg=(d,p)=>{const s=d>=0?"+":"−";return `${s}${fmtCents(d)}  (${s}${Math.abs(p).toFixed(2)}%)`};
const fmtPct=n=>n==null?"—":(n>=0?"+":"")+n.toFixed(2)+"%";
const cls=n=>n==null?"flat":n>0.001?"up":n<-0.001?"down":"flat";
const arrow=n=>n==null?"":n>0.001?"▲ ":n<-0.001?"▼ ":"";

function startIdx(t,span){
  const c=t.closes,d=t.dates;
  if(span==="ytd"){const yr=d[d.length-1].slice(0,4);const i=d.findIndex(x=>x.startsWith(yr));return i<0?0:i;}
  return Math.max(0,c.length-1-span);
}
function periodChange(t,span){
  const c=t.closes; if(!c||c.length<2) return null;
  const a=c[startIdx(t,span)], b=t.price??c[c.length-1];
  return (b-a)/a*100;
}
function dayChangePct(t){
  if(t.price==null||t.prevClose==null) return null;
  return (t.price-t.prevClose)/t.prevClose*100;
}
function holdingsFor(sym){ return HOLD? HOLD.h.find(x=>x[0]===sym):null; }

function acctValueNow(){
  let v=HOLD.cash||0;
  for(const [sym,qty] of HOLD.h){const t=DATA.tickers[sym];if(t&&t.price!=null)v+=qty*t.price;}
  return v;
}
function acctValueAgo(span){
  let v=HOLD.cash||0;
  for(const [sym,qty] of HOLD.h){
    const t=DATA.tickers[sym]; if(!t)continue;
    if(span==="day"){ v+=qty*(t.prevClose??t.price??0); }
    else{ const c=t.closes; if(!c||!c.length)continue; v+=qty*c[Math.max(0,c.length-1-span)]; }
  }
  return v;
}
function acctSeries(maxSpan){
  const lens=HOLD.h.map(([s])=>DATA.tickers[s]?.closes?.length||0).filter(Boolean);
  if(!lens.length)return[];
  const n=Math.min(Math.min(...lens), maxSpan+1);
  const ref=DATA.tickers[HOLD.h[0][0]];
  const out=[];
  for(let k=n-1;k>=0;k--){
    let v=HOLD.cash||0;
    for(const [sym,qty] of HOLD.h){
      const c=DATA.tickers[sym]?.closes; if(!c)continue;
      v+=qty*c[c.length-1-k];
    }
    out.push({d:ref.dates[ref.dates.length-1-k], v});
  }
  return out;
}
function bumpiness(t){
  const c=t.closes; if(!c||c.length<40)return null;
  const seg=c.slice(-253);
  const rets=[]; for(let i=1;i<seg.length;i++)rets.push((seg[i]-seg[i-1])/seg[i-1]);
  const m=rets.reduce((a,b)=>a+b,0)/rets.length;
  const sd=Math.sqrt(rets.reduce((a,b)=>a+(b-m)*(b-m),0)/rets.length)*100;
  if(sd<0.7)return["Calm","typically moves less than ±1% a day"];
  if(sd<1.2)return["Typical","usually moves about ±1% a day"];
  if(sd<2)return["Bumpy","often moves ±1–2% a day — expect swings"];
  return["Wild","regularly moves ±2%+ a day — big swings are normal"];
}

/* ---------- charts with scrubbing ---------- */
const W=600,H=180,P=6;
function ptsOf(s){
  const v2=s.map(p=>p.v);const mn=Math.min(...v2),mx=Math.max(...v2),r=mx-mn||1;
  return s.map((p,i)=>`${(i/(s.length-1)*(W-2*P)+P).toFixed(1)},${(H-P-(p.v-mn)/r*(H-2*P)).toFixed(1)}`).join(" ");
}
function lineSVG(series, opts={}){ // opts: {color, series2, mode:'usd'|'pct'}
  if(series.length<2)return"";
  const id="ch"+(chartSeq++);
  CHARTS[id]={series, mode:opts.mode||"usd"};
  const up=series[series.length-1].v>=series[0].v;
  const col=opts.color||(up?"var(--up)":"var(--down)");
  let svg=`<div class="chwrap" data-ch="${id}"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  if(opts.series2&&opts.series2.length>1)svg+=`<polyline points="${ptsOf(opts.series2)}" fill="none" stroke="#5c6a80" stroke-width="2" stroke-dasharray="5,4"/>`;
  svg+=`<polyline points="${ptsOf(series)}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>
  <circle class="scrubdot" r="4.5" fill="${col}" stroke="#0b0e13" stroke-width="1.5" style="display:none"/></svg>
  <div class="tip"></div>`;
  const a=series[0], b=series[series.length-1];
  const chg=b.v-a.v, chgP=a.v?chg/a.v*100:0;
  const fmt=opts.mode==="pct"?(x=>fmtPct(x-100)):fmtCents;
  const mid=opts.mode==="pct"
    ?`<span class="${cls(chgP)}">${fmtPct(chgP)} over this period</span>`
    :`<span class="${cls(chg)}">${fmtChg(chg,chgP)}</span>`;
  svg+=`<div class="chfoot"><span>${a.d}${opts.mode==="pct"?"":" · "+fmt$(a.v)}</span>${mid}<span>${b.d}${opts.mode==="pct"?"":" · "+fmt$(b.v)}</span></div></div>`;
  return svg;
}
function attachScrub(){
  document.querySelectorAll(".chwrap").forEach(w=>{
    const id=w.dataset.ch, reg=CHARTS[id]; if(!reg)return;
    const svg=w.querySelector("svg"), dot=w.querySelector(".scrubdot"), tip=w.querySelector(".tip");
    const s=reg.series;
    const vals=s.map(p=>p.v), mn=Math.min(...vals), mx=Math.max(...vals), r=mx-mn||1;
    function show(clientX){
      const rect=svg.getBoundingClientRect();
      let frac=(clientX-rect.left)/rect.width;
      frac=Math.max(0,Math.min(1,frac));
      const idx=Math.round(frac*(s.length-1));
      const p=s[idx];
      const cx=idx/(s.length-1)*(W-2*P)+P;
      const cy=H-P-(p.v-mn)/r*(H-2*P);
      dot.setAttribute("cx",cx); dot.setAttribute("cy",cy); dot.style.display="";
      const px=cx/W*rect.width, py=cy/H*rect.height;
      tip.style.left=Math.max(50,Math.min(rect.width-50,px))+"px";
      tip.style.top=py+"px";
      const val=reg.mode==="pct"?fmtPct(p.v-100)+" since start":fmtCents(p.v);
      tip.innerHTML=`<b>${val}</b><br>${p.d}`;
      tip.style.display="block";
    }
    function hide(){ dot.style.display="none"; tip.style.display="none"; }
    w.addEventListener("pointerdown",e=>show(e.clientX));
    w.addEventListener("pointermove",e=>{if(e.pressure>0||e.pointerType==="mouse")show(e.clientX);});
    w.addEventListener("pointerup",hide);
    w.addEventListener("pointerleave",hide);
    w.addEventListener("touchmove",e=>{show(e.touches[0].clientX);},{passive:true});
    w.addEventListener("touchend",hide);
  });
}

/* ---------- rendering ---------- */
function renderVToggle(){
  document.querySelectorAll('#vtoggle button').forEach(b=>{
    b.classList.toggle('on', b.dataset.v===viewMode);
    b.onclick=()=>{viewMode=b.dataset.v;localStorage.setItem('viewMode',viewMode);renderAll();};
  });
}

function renderTotals(){
  if(!HOLD){
    $("#totals").innerHTML=`<div class="card setup"><b>One-time setup</b><div class="desc" style="margin-top:6px">This device doesn't have your share counts yet. Open your private link (the one ending in <b>#h=...</b>), or paste it below.</div><input id="pasteLink" placeholder="Paste your private link here"><br><button onclick="saveFromPaste()">Load my holdings</button></div>`;
    return;
  }
  const now=acctValueNow();
  const span=chgMode==="day"?"day":parseInt(chgMode);
  const ago=acctValueAgo(span);
  const d=now-ago, p=ago?d/ago*100:0;
  const label={day:"Day",5:"Week",21:"Month",252:"Year"}[chgMode]||"Day";
  const bar=CHG_PERIODS.map(([l,v])=>`<button class="${String(chgMode)===String(v)?'on':''}" data-c="${v}">${l}</button>`).join("");
  $("#totals").innerHTML=`
  <div class="totalcard">
    <div class="total-label">Account Value</div>
    <div class="total-val">${fmt$(now)}</div>
    <div class="total-label" style="margin-top:6px">${label} Change</div>
    <div class="total-sub ${cls(d)}">${fmtChg(d,p)}</div>
    <div class="chgbar">${bar}</div>
    <div class="total-note">Includes ${fmtCents(HOLD.cash||0)} cash · Up ${fmt$(now-(HOLD.cash||0)-HOLD.h.reduce((a,x)=>a+x[2],0))} all-time vs your investment</div>
  </div>`;
  document.querySelectorAll('.chgbar button').forEach(b=>b.onclick=()=>{chgMode=b.dataset.c;localStorage.setItem('chgMode',chgMode);renderTotals();});
}

function renderTabs(){
  const syms=Object.keys(DATA.tickers).filter(s=>s!==DATA.benchmark);
  $("#tabs").innerHTML=[`<button class="tab ${active==="overview"?"active":""}" data-t="overview">Overview</button>`,
    `<button class="tab ${active==="news"?"active":""}" data-t="news">News</button>`]
    .concat(syms.map(s=>`<button class="tab ${active===s?"active":""}" data-t="${s}">${s}</button>`)).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{active=b.dataset.t;render();window.scrollTo(0,0);});
}

function renderOverview(){
  const syms=Object.keys(DATA.tickers).filter(s=>s!==DATA.benchmark);
  let html="";

  if(HOLD){
    const series=acctSeries(acctSpan);
    const pb=PERIODS.filter(p=>p[0]!=="YTD").map(([l,s])=>`<button class="pbtn ${acctSpan===s?"active":""}" data-a="${s}">${l}</button>`).join("");
    html+=`<div class="sect">Your account over time</div><div class="card"><div class="periods">${pb}</div>${lineSVG(series)}</div>`;
  }

  html+=`<div class="sect">Your holdings</div>`;
  html+=syms.map(sym=>{
    const t=DATA.tickers[sym], h=holdingsFor(sym), d=dayChangePct(t);
    const isFund=sym==="SWPPX";
    const dayTxt=(isFund&&(d==null||Math.abs(d)<0.0001))?`<span class="flat">updates after close</span>`:`<span class="${cls(d)}">${arrow(d)}${fmtPct(d)} today</span>`;
    let main, sub;
    if(viewMode==="value"&&h&&t.price!=null){ main=fmt$(h[1]*t.price); const g=h[1]*t.price-h[2]; sub=`<div class="d ${cls(g)}">${g>=0?"+":"−"}${fmt$(Math.abs(g))} all-time</div>`; }
    else { main=fmt$(t.price)+"/share"; sub=""; }
    return `<div class="card rowcard" data-go="${sym}">
      <div class="l"><div class="sym">${sym}</div><div class="nm">${t.name||""}</div></div>
      <div class="r"><div class="v">${main}</div><div class="d">${dayTxt}</div>${sub}</div>
    </div>`;
  }).join("");

  if(HOLD){
    const now=acctValueNow();
    const parts=HOLD.h.map(([sym,qty])=>{const t=DATA.tickers[sym];return {sym,v:t&&t.price!=null?qty*t.price:0};});
    parts.push({sym:"Cash",v:HOLD.cash||0});
    parts.sort((a,b)=>b.v-a.v);
    html+=`<div class="sect">Breakdown</div><div class="card">`+
      parts.map(p=>{const pc=now?p.v/now*100:0;return `<div class="alloc-row"><div class="sym">${p.sym}</div><div class="bar"><div class="fill" style="width:${pc.toFixed(1)}%;background:${COLORS[p.sym]||"var(--accent)"}"></div></div><div class="pct">${pc.toFixed(1)}% · ${fmt$(p.v)}</div></div>`;}).join("")+
      `</div>`;
  }

  const movers=syms.map(sym=>({sym,d:dayChangePct(DATA.tickers[sym])})).filter(m=>m.d!=null&&Math.abs(m.d)>0.0001).sort((a,b)=>b.d-a.d);
  if(movers.length){
    html+=`<div class="sect">Today's movers</div><div class="card">`+
      movers.map(m=>{const h=holdingsFor(m.sym);const t=DATA.tickers[m.sym];const imp=h&&t.prevClose!=null?h[1]*(t.price-t.prevClose):null;
        return `<div class="mover"><span><b>${m.sym}</b></span><span class="${cls(m.d)}">${arrow(m.d)}${fmtPct(m.d)}${imp!=null?` · ${imp>=0?"+":"−"}${fmt$(Math.abs(imp))}`:""}</span></div>`;}).join("")+`</div>`;
  }

  $("#content").innerHTML=html;
  document.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{active=el.dataset.go;render();window.scrollTo(0,0);});
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{acctSpan=parseInt(b.dataset.a);renderOverview();});
  attachScrub();
}

function renderNews(){
  const syms=Object.keys(DATA.tickers).filter(s=>s!==DATA.benchmark);
  let html="";
  syms.forEach(sym=>{
    const t=DATA.tickers[sym], d=dayChangePct(t);
    const ov=t.overview&&t.overview.length>20?t.overview:"No major news coverage right now — quiet is normal, and usually good.";
    const links=(t.news||[]).slice(0,3).map(n=>`<div class="item"><a href="${n.link}" target="_blank" rel="noopener">${n.title}</a></div>`).join("");
    html+=`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-weight:700">${sym} <span style="color:var(--faint);font-weight:400;font-size:.78rem">${t.name||""}</span></span>
        <span class="${cls(d)}" style="font-size:.85rem">${arrow(d)}${fmtPct(d)}</span>
      </div>
      <div class="desc" style="margin-top:8px">${ov}</div>
      ${links?`<div class="news" style="margin-top:8px;border-top:1px solid var(--line)">${links}</div>`:""}
    </div>`;
  });
  html+=`<div class="note">Overviews are distilled automatically from recent financial press coverage and refresh with the market data.</div>`;
  $("#content").innerHTML=html;
}

function tickerSeries(t,span){
  const i0=startIdx(t,span);
  return t.dates.slice(i0).map((d,i)=>({d,v:t.closes[i0+i]}));
}
function normalized(series){ const b=series[0].v; return series.map(p=>({d:p.d,v:p.v/b*100})); }

function renderStock(sym){
  const t=DATA.tickers[sym], h=holdingsFor(sym), d=dayChangePct(t);
  const bm=DATA.tickers[DATA.benchmark];
  const isFund=sym==="SWPPX";
  const span=chartPeriod[sym]??252;
  const cmp=cmpMarket[sym]??false;

  const chips=PERIODS.map(([label,s])=>{
    const v=periodChange(t,s), b=bm?periodChange(bm,s):null;
    let m="";
    if(v!=null&&b!=null){const diff=v-b; m=Math.abs(diff)<0.5?"≈ market":(diff>0?"beat market":"under market");}
    return `<div class="chip"><div class="p">${label}</div><div class="v ${cls(v)}">${fmtPct(v)}</div><div class="m">${m}</div></div>`;
  }).join("");

  let bigLine, smallLine;
  if(viewMode==="value"&&h&&t.price!=null){
    bigLine=`${fmt$(h[1]*t.price)} <span style="font-size:.8rem;color:var(--faint);font-weight:400">your position</span>`;
    smallLine=`${fmtCents(t.price)} per share · you own ${h[1].toLocaleString()} shares`;
  } else {
    bigLine=`${t.price!=null?fmtCents(t.price):"—"} <span style="font-size:.8rem;color:var(--faint);font-weight:400">per share</span>`;
    smallLine=h?`Your ${h[1].toLocaleString()} shares are worth ${fmt$(h[1]*t.price)}`:"";
  }
  const dayLine=(isFund&&(d==null||Math.abs(d)<0.0001))
    ?`<div class="flat" style="font-size:.9rem;margin-top:4px">Price updates once daily, after market close</div>`
    :`<div class="${cls(d)}" style="font-size:1rem;margin-top:4px;font-weight:600">${h&&t.prevClose!=null?fmtChg(h[1]*(t.price-t.prevClose),d):arrow(d)+fmtPct(d)} today</div>`;

  const bump=bumpiness(t);
  let range52="";
  if(t.closes&&t.closes.length>20&&t.price!=null){
    const yr=t.closes.slice(-253);
    const lo=Math.min(...yr),hi=Math.max(...yr);
    const pos52=(t.price-lo)/((hi-lo)||1)*100;
    const where=pos52>85?"near its 1-year high":pos52<15?"near its 1-year low":pos52>=50?"in the upper part of its 1-year range":"in the lower part of its 1-year range";
    range52=`<div class="badge">Past year: ${fmtCents(lo)} – ${fmtCents(hi)} · currently ${where}</div>`;
  }
  const pos=h?`<div class="sect">Your position</div><div class="pos-grid">
    <div class="cell"><div class="k">You own</div><div class="v">${h[1].toLocaleString()} shares</div></div>
    <div class="cell"><div class="k">Worth now</div><div class="v">${t.price!=null?fmt$(h[1]*t.price):"—"}</div></div>
    <div class="cell"><div class="k">Investment</div><div class="v">${fmt$(h[2])}</div></div>
    <div class="cell"><div class="k">Your profit</div><div class="v ${t.price!=null?cls(h[1]*t.price-h[2]):""}">${t.price!=null?fmt$(h[1]*t.price-h[2]):"—"}</div></div>
  </div>`:"";

  const m1=periodChange(t,21), mB=bm?periodChange(bm,21):null;
  let plain="";
  if(m1!=null){
    plain=`Over the past month, ${sym} is ${m1>=0?"up":"down"} ${Math.abs(m1).toFixed(1)}%. `;
    if(mB!=null){const diff=m1-mB;
      plain+=Math.abs(diff)<0.5?`That's about the same as the overall market.`:(diff>0?`The overall market moved ${fmtPct(mB)}, so ${sym} did better than the market.`:`The overall market moved ${fmtPct(mB)}, so ${sym} lagged behind the market a bit.`);}
  }

  const series=tickerSeries(t,span);
  const chart=cmp&&bm
    ? lineSVG(normalized(series),{color:"var(--accent)",series2:normalized(tickerSeries(bm,span)),mode:"pct"})
    : lineSVG(series);
  const legend=cmp?`<div class="legend"><span><span class="dot" style="background:var(--accent)"></span>${sym}</span><span><span class="dot" style="background:#5c6a80"></span>S&P 500 (market)</span></div>`:"";

  const ovText=t.overview&&t.overview.length>20?t.overview:"";
  const newsOverview=ovText?`<div class="sect">News overview</div><div class="plain">${ovText}</div>`:"";
  const news=(t.news&&t.news.length)?`<div class="sect">Recent news</div><div class="card news">`+
    t.news.map(n=>`<div class="item"><a href="${n.link}" target="_blank" rel="noopener">${n.title}</a><div class="dt">${n.date||""}</div></div>`).join("")+`</div>`:"";

  $("#content").innerHTML=`
    <div class="card">
      <div style="font-weight:700">${t.name||sym}</div>
      <div class="desc" style="margin-top:6px">${DESC[sym]||""}</div>
      <div class="price-big">${bigLine}</div>
      <div class="price-small">${smallLine}</div>
      ${dayLine}
      ${bump?`<div class="badge">Bumpiness: <b style="color:var(--text)">${bump[0]}</b> — ${bump[1]}</div>`:""}
      ${range52}
    </div>
    ${pos}
    <div class="sect">Performance</div>
    <div class="chips">${chips}</div>
    <div class="plain">${plain}</div>
    <div class="card">
      <div class="periods">${PERIODS.map(([l,s])=>`<button class="pbtn ${String(span)===String(s)?"active":""}" data-p="${s}">${l}</button>`).join("")}
        <button class="pbtn ${cmp?"active":""}" data-cmp="1" style="margin-left:auto">vs market</button></div>
      ${chart}${legend}
    </div>
    ${newsOverview}
    ${news}
    <div class="note">Performance is price change only; your actual return is a little higher because dividends buy extra shares along the way.</div>`;
  document.querySelectorAll(".pbtn[data-p]").forEach(b=>b.onclick=()=>{chartPeriod[sym]=b.dataset.p==="ytd"?"ytd":parseInt(b.dataset.p);renderStock(sym);});
  const cb=document.querySelector(".pbtn[data-cmp]"); if(cb)cb.onclick=()=>{cmpMarket[sym]=!cmp;renderStock(sym);};
  attachScrub();
}

function render(){
  CHARTS={}; chartSeq=0;
  renderTabs();
  if(active==="overview") renderOverview();
  else if(active==="news") renderNews();
  else renderStock(active);
}
function renderAll(){ renderVToggle(); renderTotals(); render(); }

async function boot(){
  HOLD=loadHoldings();
  try{
    const r=await fetch("data.json?t="+Date.now());
    DATA=await r.json();
  }catch(e){
    $("#content").innerHTML=`<div class="card">Couldn't load market data. Check your connection and try again.</div>`;return;
  }
  $("#updated").textContent="Updated "+DATA.updated;
  renderAll();
}
boot();
</script>
